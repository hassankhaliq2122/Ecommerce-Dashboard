# Netlify Configuration for Shoplytics Dashboard (my-app)

[build]
  publish = "dist"
  command = "npm run build"

# Proxy /api requests directly to deployed Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://ecommerce-dashboard-production-0c64.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA Fallback - Redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production Security Headers & Cache Optimization
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache immutable assets for maximum performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
